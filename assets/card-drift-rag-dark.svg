<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 268" width="480" height="268" role="img" aria-label="Drift-Aware RAG: Label-free detection of retrieval decay from embedding geometry, on real arXiv, Python-docs and Wikipedia revisions. 100% false alarms: when a drift threshold meets 10× less traffic. So it ships calibrated z-scores, not thresholds">
<title>Drift-Aware RAG: Label-free detection of retrieval decay from embedding geometry, on real arXiv, Python-docs and Wikipedia revisions. 100% false alarms: when a drift threshold meets 10× less traffic. So it ships calibrated z-scores, not thresholds</title>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}</style>
<defs>
<linearGradient id="dribg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a26"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<radialGradient id="drig1" cx="0.92" cy="0.0" r="0.65"><stop offset="0" stop-color="#db6d28" stop-opacity="0.22"/><stop offset="1" stop-color="#db6d28" stop-opacity="0"/></radialGradient>
<radialGradient id="drig2" cx="0.0" cy="1.0" r="0.6"><stop offset="0" stop-color="#4493f8" stop-opacity="0.14"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/></radialGradient>
<pattern id="dridots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#262c36"/></pattern>
<clipPath id="driclip"><rect x="1" y="1" width="478" height="266" rx="14"/></clipPath>
</defs>
<g clip-path="url(#driclip)">
<rect width="480" height="268" fill="url(#dribg)"/>
<rect width="480" height="268" fill="url(#dridots)"/>
<rect width="480" height="268" fill="url(#drig1)"/>
<rect width="480" height="268" fill="url(#drig2)"/>
</g>
<rect x="0.5" y="0.5" width="479" height="267" rx="14" fill="none" stroke="#3d444d"/>
<rect x="24" y="0" width="64" height="3" rx="1.5" fill="#db6d28"/>
<text class="s" x="24" y="46" font-size="21" font-weight="700" fill="#f0f6fc">Drift-Aware RAG</text>
<circle cx="400.2" cy="41" r="5" fill="#db6d28"/>
<text class="m" x="456" y="45" font-size="12" text-anchor="end" fill="#9198a1">Python</text>
<text class="s" x="24" y="76" font-size="13.5" fill="#d1d7e0">Label-free detection of retrieval decay from embedding</text>
<text class="s" x="24" y="96" font-size="13.5" fill="#d1d7e0">geometry, on real arXiv, Python-docs and Wikipedia revisions.</text>
<text class="s" x="23" y="158" font-size="34" font-weight="700" fill="#db6d28" letter-spacing="-0.5">100% false alarms</text>
<text class="s" x="24" y="184" font-size="13" fill="#9198a1">when a drift threshold meets 10× less traffic.</text>
<text class="s" x="24" y="202" font-size="13" fill="#9198a1">So it ships calibrated z-scores, not thresholds</text>
<rect x="24.0" y="222" width="139.7" height="24" rx="12.0" fill="#1c2330" stroke="#3d444d"/><text class="m" x="35.0" y="238.1" font-size="11.5" fill="#9198a1">permutation nulls</text>
<rect x="171.7" y="222" width="42.8" height="24" rx="12.0" fill="#1c2330" stroke="#3d444d"/><text class="m" x="182.7" y="238.1" font-size="11.5" fill="#9198a1">MMD</text>
<rect x="222.5" y="222" width="125.8" height="24" rx="12.0" fill="#1c2330" stroke="#3d444d"/><text class="m" x="233.5" y="238.1" font-size="11.5" fill="#9198a1">negative result</text>
<text class="m" x="456" y="238" font-size="12" text-anchor="end" fill="#db6d28">view repo ↗</text>
</svg>
